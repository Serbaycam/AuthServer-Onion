services:
  postgres_db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: AuthServerIdentityDb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d AuthServerIdentityDb"]
      interval: 10s
      timeout: 5s
      retries: 5

  authserver-api:
    build:
      context: .
      dockerfile: AuthServer.Identity.API/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      AdminSession__RequireHttps: ${ADMIN_SESSION_REQUIRE_HTTPS:-false}
      DataProtection__KeysPath: /var/lib/authserver/keys
      ReverseProxy__KnownNetworks__0: ${TRUSTED_PROXY_NETWORK:-}
      ConnectionStrings__DefaultConnection: "Host=postgres_db;Database=AuthServerIdentityDb;Username=myuser;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET}
      Database__Initialize: ${DATABASE_INITIALIZE:-false}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - auth_keys:/var/lib/authserver/keys
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  authadmin-panel:
    environment:
      PANEL_PUBLIC_SCHEME: ${PANEL_PUBLIC_SCHEME:-http}
    build:
      context: ./AuthServer-AdminPanel
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - authserver-api
    restart: unless-stopped

volumes:
  auth_keys:
  postgres_data:
    name: my-postgres-env_pgdata
