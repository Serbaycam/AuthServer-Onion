server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://authserver-api:8080;
        proxy_set_header Host $host;
        # Deployment configuration, never an untrusted incoming header.
        proxy_set_header X-Forwarded-Proto ${PANEL_PUBLIC_SCHEME};
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
